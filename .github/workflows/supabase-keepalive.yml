name: Keep Supabase Active

on:
  schedule:
    - cron: "0 0 * * 2,5"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping_supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Strip any trailing whitespace/newlines from secrets (common cause
          # of 401 when a key is pasted into GitHub's secret UI with a newline).
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          echo "Pinging Supabase at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # The keep-alive's goal is to PREVENT inactivity pause, not to verify
          # auth. ANY HTTP response (2xx/3xx/4xx) proves the project is awake
          # and processing requests. Only a connection failure (000) or a 5xx
          # response means the project is paused or down. Per 02-system-design
          # section 6: fail loud on real failures, not on auth rejections.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X GET "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase REST API responded with HTTP ${STATUS}"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Supabase is awake (HTTP ${STATUS} = server responded)."
            if [ "$STATUS" -eq 401 ] || [ "$STATUS" -eq 403 ]; then
              echo "::warning::Supabase returned ${STATUS} (auth rejected). The project IS awake, but the anon key may be wrong or have trailing whitespace. Verify SUPABASE_ANON_KEY in the repo secrets."
            fi
          else
            echo "::error::Supabase REST API returned HTTP ${STATUS} (5xx or connection failure). The project may be paused or down."
            exit 1
          fi
